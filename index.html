<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto Leasein</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="contact-widget">
        <header class="widget-header">
            <h2>Contáctanos</h2>
            <p>Déjanos tus datos y te responderemos a la brevedad.</p>
        </header>

        <form id="contactForm" class="contact-form" novalidate>
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
                <span class="error-msg" id="error-nombre"></span>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="nombre@empresa.com" required>
                <span class="error-msg" id="error-email"></span>
            </div>

            <div class="form-group">
                <label for="mensaje">Mensaje</label>
                <div class="textarea-wrapper">
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="¿En qué podemos ayudarte?" required></textarea>
                    <div id="securityTooltip" class="tooltip hidden">
                        🔒 No compartas datos sensibles (tarjetas, contraseñas).
                    </div>
                </div>
                <span class="error-msg" id="error-mensaje"></span>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">
                <span>Enviar Mensaje</span>
                <div class="spinner hidden"></div>
            </button>
        </form>
        
        <div id="formFeedback" class="feedback-box hidden"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
